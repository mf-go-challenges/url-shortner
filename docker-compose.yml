services:
  app:
    build:
      context: ../
      dockerfile: docker/Dockerfile
    container_name: urlshortner_app
    ports:
      - "${PORT}:${PORT}"
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      ENV: ${ENV}
    depends_on:
      - postgres
    networks:
      - shortUrl_network

  postgres:
    image: postgres
    container_name: urlshortner_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - urlshort_postgres:/var/lib/postgresql
    ports:
      - "5433:5432"
    networks:
      - shortUrl_network
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    container_name: urlshortner_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    volumes:
      - urlshort_pgadmin:/var/lib/pgadmin
    ports:
      - "8091:80"
    networks:
      - shortUrl_network
    restart: unless-stopped
    depends_on:
      - postgres

volumes:
  urlshort_postgres:
  urlshort_pgadmin:

networks:
  shortUrl_network:
